[package]
name = "iron-rainbow"
version = "0.1.0"
edition = "2021"
default-run = "iron-rainbow"

[dependencies]
wgpu = "22.1"
pollster = "0.3"
image = "0.25"
bytemuck = { version = "1.14", features = ["derive"] }
futures-intrusive = "0.5"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
winit = "0.29"
env_logger = "0.11"
log = "0.4"
anyhow = "1.0"
chrono = "0.4"

[dev-dependencies]
# For visualization examples
imageproc = "0.25"
