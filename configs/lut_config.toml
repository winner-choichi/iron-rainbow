# Lookup Table (LUT) generation parameters for Phase 2

[grid]
# Wavelength axis (rows)
wavelength_min_nm = 230.0
wavelength_max_nm = 300.0
wavelength_steps = 64

# Scattering-angle axis (columns)
# 0° = forward scattering, 180° = backward scattering
# Water rainbow ≈ 42°, Iron rainbow ≈ 8-10° (backward)
angle_min_deg = 0.0
angle_max_deg = 180.0
angle_steps = 512

# Optional supersampling factor when mapping rays to bins
angle_supersample = 4

[intensity]
normalize_mode = "global"   # options: per_wavelength, global
exposure = 0.01  # Normalized to [0, 1] range (viewer controls final exposure)

[droplet]
radius_um = 0.03
impact_min = 0.05
impact_max = 0.85
impact_samples = 128
rays_per_wavelength = 200000

[wavelength]
# How many wavelengths to batch in a single GPU submission
batch_size = 4
wavelength_step_nm = 0.5

[output]
texture_path = "output/iron_rainbow_lut.png"
metadata_path = "output/iron_rainbow_lut.json"
format = "png16"   # options: png8, png16, hdr

[renderer]
false_color = [
    { wavelength = 230.0, color = [80, 80, 255] },     # Deep blue (shortest UV)
    { wavelength = 253.3, color = [64, 200, 255] },    # Cyan-blue
    { wavelength = 276.7, color = [100, 255, 100] },   # Green
    { wavelength = 300.0, color = [255, 100, 80] }     # Red-orange (longest UV)
]
channel_wavelengths = [295.0, 287.5, 280.0]  # [R, G, B] - 275-300nm range only
